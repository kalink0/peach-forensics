[package]
name = "peach"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kalink0/peach-forensics"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
csv = "1.3.1"
directories = "6.0.0"
duckdb = { version = "1.10505.0", features = ["bundled", "chrono", "json", "serde_json"] }
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["datepicker"] }
evtx = { version = "0.12.2", default-features = false, features = ["multithreading"] }
jiff = "0.2.35"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
macos-unifiedlogs = "0.6.0"
pollster = "0.4.0"
rayon = "1.12.0"
regex = "1.13.1"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.3"
toml_edit = "0.25"
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
