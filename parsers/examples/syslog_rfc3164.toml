# Built-in starter format: classic BSD syslog (RFC 3164) —
# "Mon DD HH:MM:SS host process[pid]: message". Regex/timestamp_format
# style-confirmed against real-world BSD-syslog output (matches the same
# shape crush's own multi-log viewer detects for this format).
#
# RFC 3164 carries neither a year nor a timezone in the timestamp itself —
# both `assume_year` and `assume_offset` are deliberately left unset here,
# not guessed (a bare "assume this year" default would silently be wrong
# for the historical log files forensic work usually deals with). The live
# preview will show every line failing to parse until both are filled in
# for this specific source. No severity/level field exists in this format
# either, so `message` is the only field mapped.

[parser]
name = "Syslog (RFC 3164)"
sourcetype = "syslog"

[parser.pattern]
regex = '^(?P<timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<host>\S+)\s+(?P<process>[^\[:]+)(?:\[\d+\])?:\s*(?P<message>.*)$'
timestamp_format = "%b %e %H:%M:%S"

[parser.field_mapping]
message = "message"
