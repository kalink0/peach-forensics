# AUL pattern-of-life: WiFi association/scan/network-change events.
# Predicates from "Apple Unified Log Predicates in iLEAPP: The Reference"
# (Alexis Brignoni): leapps.org/blog-post?post=2026-08-01-unified-log-predicate-reference
# — "logarchive wifi status".

[rule]
name = "aul_wifi_status"
description = "WiFi state changes, network joins, and scan activity"
version = "1"

[rule.match]
sourcetype = "aul"
message_contains = [
    "WiFi state changed:",
    "Toggled WiFi state",
    "is WiFi associated?",
    "link status changed",
    "reachability changed",
    "ISNetworkObserver",
    "ForgetSSID",
    "en0: SSID",
    "Removing Lease SSID",
    "SysMon: WiFi state changed:",
    "WiFiManagerClientRemoveNetworkWithReason:",
    "WiFiSecurityRemovePassword",
    "AlwaysOnWifi:",
    "WiFiDeviceManagerSetNetworks:",
    "Scanning For Broadcast found:",
    "Scanning Remaining Channels",
    "WiFiSettlementObserver _handleScanResults",
    "Attempting to join",
    "WiFiLQAMgrSetCurrentNetwork: Joined SSID:",
    "Preparing background scan request for",
    "WiFiNetworkPrepareKnownBssList",
    "to list of known networks",
    "{AUTOJOIN, SCAN*} Scanning 2Ghz Channels found:",
    "{AUTOJOIN, SCAN*} Scanning 5Ghz Channels found:",
    "WFMacRandomisation",
    "manual association",
    "Copy password for Network",
    "Attempting auto join association",
    "Link went down",
    "Total connection time",
]

[rule.tag]
value = "wifi_status"
