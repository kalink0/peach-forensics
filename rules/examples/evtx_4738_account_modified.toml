# EVTX Security-Auditing: a user account was changed. Companion tag to the
# built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4738(S) A user
# account was changed":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4738

[rule]
name = "evtx_account_modified"
description = "A user account was changed (Security-Auditing 4738)"

[rule.match]
sourcetype = "evtx"
event_id = 4738

[rule.tag]
value = "account_modified"
