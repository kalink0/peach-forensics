# journald: a user's password was changed via the passwd command.
# passwd.c's own SYSLOG() call on success is
# `SYSLOG(LOG_INFO, "password for '%s' changed by '%s'", name, myname)` —
# confirmed directly against shadow-utils source:
# https://github.com/shadow-maint/shadow/blob/master/src/passwd.c
# "changed by '" is the fixed, distinctive part of that line.

[rule]
name = "journald_password_changed"
description = "A user's password was changed via passwd"

[rule.match]
sourcetype = "journald"
process = "passwd"
message_contains = "changed by '"

[rule.tag]
value = "password_changed"
