# EVTX: Remote Desktop RemoteConnectionManager 1149. The manifest text is
# "Remote Desktop Services: User authentication succeeded", with the user,
# domain and source network address in Param1/Param2/Param3 (UserData, not
# EventData).
#
# Despite that wording it does not show a successful logon: ponderthebits
# reports, from testing, that the event is logged for a successful RDP
# network connection, before any credentials are entered - "someone
# reached this machine over RDP", with the user name only as the client
# presented it. The session logon itself is LocalSessionManager 21
# (evtx_21_ts_session_logon.toml) and Security 4624 with LogonType 10
# (evtx_4624_rdp_logon.toml).
#
# Not validated on local data (no RemoteConnectionManager log was
# available). Rests on the provider's manifest message text and field
# names (the OS message resources, as listed in nasbench's
# EVTX-ETW-Resources,
# ETWProvidersCSVs/Internal/Microsoft-Windows-TerminalServices-RemoteConnectionManager.csv)
# and on EricZimmerman's EvtxECmd map for this event (MIT).
#
# Interpretation source: ponderthebits, "Windows RDP-Related Event Logs:
# Identification, Tracking, and Investigation" (2018).
#
# https://ponderthebits.com/2018/02/windows-rdp-related-event-logs-identification-tracking-and-investigation/

[rule]
name = "evtx_rdp_connection_established"
description = "An RDP network connection was authenticated (RemoteConnectionManager 1149) - not proof of a successful logon"
version = "1"

[rule.match]
sourcetype = "evtx"
provider = "Microsoft-Windows-TerminalServices-RemoteConnectionManager"
event_id = 1149

[rule.tag]
value = "rdp_connection_established"
