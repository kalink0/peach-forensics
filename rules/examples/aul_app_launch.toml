# AUL pattern-of-life: app icon taps and launches (finer-grained focus/
# lifecycle tracking is a separate rule, aul_app_focus_lifecycle).
# Predicates from "Apple Unified Log Predicates in iLEAPP: The Reference"
# (Alexis Brignoni): leapps.org/blog-post?post=2026-08-01-unified-log-predicate-reference
# — "logarchive executed apps".

[rule]
name = "aul_app_launch"
description = "App icon taps and application launches"
version = "1"

[rule.match]
sourcetype = "aul"
message_contains = [
    "Allowing tap for icon view",
    "Launching application",
    "transition source:",
]

[rule.tag]
value = "app_launch"
