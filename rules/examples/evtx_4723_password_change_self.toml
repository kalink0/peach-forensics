# EVTX Security-Auditing: a user attempted to change their own account
# password (distinct from 4724, an admin resetting someone else's — see
# evtx_4724_password_reset_attempt.toml). Reference: Microsoft's official
# Security Auditing event reference,
# "4723(S, F) An attempt was made to change an account's password":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4723

[rule]
name = "evtx_password_change_self"
description = "An attempt was made to change an account's own password (Security-Auditing 4723)"

[rule.match]
sourcetype = "evtx"
event_id = 4723

[rule.tag]
value = "password_change_self"
