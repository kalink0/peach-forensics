# EVTX System log, Microsoft-Windows-Kernel-General 12, "The operating
# system started at system time {StartTime}." The kernel's own boot
# marker, the same real-world event as EventLog 6005
# (evtx_6005_system_boot.toml), so it carries the same tag. Event ID 12 is
# also used by other providers - Microsoft-Windows-UserModePowerService
# logs one on the same machines - which is why the provider is part of the
# match.
#
# Checked against real records. Rests on the provider's manifest message
# text and field names (the OS message resources, as listed in nasbench's
# EVTX-ETW-Resources,
# ETWProvidersCSVs/Internal/Microsoft-Windows-Kernel-General.csv) and on
# EricZimmerman's EvtxECmd map for this event (MIT).

[rule]
name = "evtx_kernel_general_os_started"
description = "The operating system started (Kernel-General 12) - StartTime in the record"
version = "1"

[rule.match]
sourcetype = "evtx"
provider = "Microsoft-Windows-Kernel-General"
event_id = 12

[rule.tag]
value = "system_boot"
