# EVTX: LocalSessionManager 24, "Remote Desktop Services: Session has been
# disconnected" - a disconnect that leaves the session running. The same
# real-world event as Security 4779 (evtx_4779_session_disconnected.toml),
# logged by a different provider, so it carries the same tag - like
# Kernel-Power 41 and EventLog 6008 for an unexpected shutdown.
#
# Microsoft-Windows-TerminalServices-LocalSessionManager/Operational logs
# console sessions as well as Remote Desktop sessions. `Address` is LOCAL
# for a console session and a network address for a remote one, so a match
# alone is not proof of a remote connection. The fields are in
# UserData/EventXML, not EventData. DLEAPP's `windowsRdpSessions` reports
# the same five events (21-25).
#
# Checked against real records. Rests on the provider's manifest message
# text and field names (the OS message resources, as listed in nasbench's
# EVTX-ETW-Resources,
# ETWProvidersCSVs/Internal/Microsoft-Windows-TerminalServices-LocalSessionManager.csv)
# and on EricZimmerman's EvtxECmd map for this event (MIT).

[rule]
name = "evtx_ts_session_disconnected"
description = "Terminal Services session disconnected (LocalSessionManager 24) - the same event Security 4779 records"
version = "1"

[rule.match]
sourcetype = "evtx"
provider = "Microsoft-Windows-TerminalServices-LocalSessionManager"
event_id = 24

[rule.tag]
value = "session_disconnected"
