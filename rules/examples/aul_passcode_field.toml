# AUL pattern-of-life: the passcode text field (SBUIPasscodeTextField)
# becoming the keyboard input target ("forSetDelegate:") and ceasing to be
# it ("_teardownExistingDelegate:"). Shows that a passcode field was on
# screen — not the digits, and not whether the code was correct.
#
# The process separates the lock screen (SpringBoard) from passcode prompts
# for another authentication (CoreAuthUI on iOS 17.2.1 and 18.7,
# LocalAuthenticationUIService on iOS 26.5.2, per iLEAPP); filter by the
# Process column to tell them apart.
#
# Sources: Tim Korver's "Apple Unified Log search term and process
# cheatsheet" (v2, published with Thesis Friday #31 on 2026-10-16, CC
# BY-NC-ND 4.0) lists "SBUIPasscodeTextField" (SpringBoard) for "passcode
# field was on screen", not measured on iOS 18 and older:
# https://thesisfriday.com/unified-log-search-terms-cheatsheet/
# The two message forms matched here are iLEAPP's
# (`logarchive_passcode_field`, commit 055b35a, 2026-10-03):
# https://github.com/abrignoni/iLEAPP. iLEAPP saw the two forms in
# equal numbers on each of its iOS 17.2.1-26.5.2 images and none on iOS
# 12.4. iLEAPP's `LIKE '%_teardown...'` treats the leading underscore as a
# one-character wildcard; matched literally here.
#
# Version 2 adds "Suppress Scanning State", which the cheatsheet lists in
# the same "Passcode entered" row (UIKit:KeyboardSceneDelegate), as given
# there: the passcode field was on screen, not measured on iOS 18 and
# older.

[rule]
name = "aul_passcode_field"
description = "Passcode text field shown / dismissed as keyboard input target — not the digits, not the outcome"
version = "2"

[rule.match]
sourcetype = "aul"
message_contains = [
    "forSetDelegate:<SBUIPasscodeTextField",
    "_teardownExistingDelegate:<SBUIPasscodeTextField",
    "Suppress Scanning State",
]

[rule.tag]
value = "passcode_field"
