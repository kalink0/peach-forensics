# EVTX Security-Auditing: a user account was created. Companion tag to the
# built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4720(S) A user
# account was created":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4720

[rule]
name = "evtx_account_created"
description = "A user account was created (Security-Auditing 4720)"
version = "1"

[rule.match]
sourcetype = "evtx"
event_id = 4720

[rule.tag]
value = "account_created"
