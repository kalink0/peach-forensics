# AUL pattern-of-life: personal hotspot/tethering state.
# Predicates from "Apple Unified Log Predicates in iLEAPP: The Reference"
# (Alexis Brignoni): leapps.org/blog-post?post=2026-08-01-unified-log-predicate-reference
# — "logarchive personal hotspot".

[rule]
name = "aul_tethering"
description = "Personal hotspot / tethering enabled or disabled"
version = "1"

[rule.match]
sourcetype = "aul"
message_contains = [
    "Tethering is now enabled with",
    "Received notification that wireless modem state changed",
    "Previous tethering state was",
]

[rule.tag]
value = "tethering"
