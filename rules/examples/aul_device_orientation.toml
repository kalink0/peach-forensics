# AUL pattern-of-life: physical device orientation changes (portrait,
# landscape, face up/down), logged by backboardd's CoreMotion-backed
# orientation subsystem. Logs more densely while the screen is on and the
# device is being actively handled, sparsely while screen-off — a rough
# proxy for handling activity independent of touch/unlock events.
#
# Source: Thesis Friday #2 (Tim Korver):
# https://thesisfriday.com/thesis-friday-2-aul-device-orientation/
#
# Version 2 adds the kernel's "[TTW] Orientation changed", from Tim
# Korver's "Apple Unified Log search term and process cheatsheet" (v2,
# published with Thesis Friday #31 on 2026-10-16, CC BY-NC-ND 4.0):
# https://thesisfriday.com/unified-log-search-terms-cheatsheet/
# The cheatsheet lists it as the sensor-level line (AOP, its own
# microsecond counter, no process in between) and as the line to count
# pick-ups on instead of "Gesture notification:". iLEAPP
# (`logarchive_orientation`, commit 055b35a, 2026-10-03) saw it on iOS
# 17.2.1, 18.7 and 26.5.2: https://github.com/abrignoni/iLEAPP. Per the
# cheatsheet, processes report different start states for the same event
# (including Ambiguous): the end state is reliable, the start state is
# not. On iOS 12 the rotation line came from SpringBoard / CoreMotion
# under another name, which gives zero hits on iOS 26 (and the other way
# around), so a zero here on an old build is not an absence of rotations.
# iLEAPP's broader "Received orientation" (no trailing period) also
# takes FrontBoard's "Received orientation update: <FBSOrientationUpdate
# ...>"; that form is a different message and stays unmatched here. Wake
# gestures such as a pick-up, which iLEAPP reports in the same artifact,
# are aul_wake_gesture.toml.

[rule]
name = "aul_device_orientation"
description = "Device orientation transitions (portrait/landscape/face up-down)"
version = "2"

[rule.match]
sourcetype = "aul"
message_contains = [
    "Received orientation.",
    "[TTW] Orientation changed",
]

[rule.tag]
value = "device_orientation"
