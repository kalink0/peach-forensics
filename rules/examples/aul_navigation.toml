# AUL pattern-of-life: turn-by-turn navigation (Maps) usage.
# Predicates from "Apple Unified Log Predicates in iLEAPP: The Reference"
# (Alexis Brignoni): leapps.org/blog-post?post=2026-08-01-unified-log-predicate-reference
# — "logarchive navigation". The source's `'%Proceed to\%'`/`'%Arrived\%'`
# predicates use `\%` as an escaped *literal* percent character, not a
# wildcard — they match text containing an actual "%" right after "Proceed
# to"/"Arrived" (e.g. a literal progress percentage in the message), so
# they're ported here as "Proceed to%"/"Arrived%" with the real percent
# character, not broadened to a bare "Proceed to"/"Arrived".

[rule]
name = "aul_navigation"
description = "Turn-by-turn navigation instructions (Maps usage)"
version = "1"

[rule.match]
sourcetype = "aul"
message_contains = [
    "Starting route to",
    "Proceed to the",
    "Proceed to%",
    "Turn right",
    "Turn left",
    "roundabout",
    "first exit",
    "Stay in the",
    "parking lot for",
    "of a mile",
    "In about",
    "then arrive",
    "your destination",
    "At the light",
    "Arrived%",
]

[rule.tag]
value = "navigation"
