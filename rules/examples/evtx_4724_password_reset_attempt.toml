# EVTX Security-Auditing: an attempt was made to reset an account's
# password. Companion tag to the built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4724(S) An
# attempt was made to reset an account's password":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4724

[rule]
name = "evtx_password_reset_attempt"
description = "An attempt was made to reset an account's password (Security-Auditing 4724)"
version = "1"

[rule.match]
sourcetype = "evtx"
event_id = 4724

[rule.tag]
value = "password_reset_attempt"
