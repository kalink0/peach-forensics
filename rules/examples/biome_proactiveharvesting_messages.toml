# Apple Biome/SEGB — ProactiveHarvesting.Messages: message content proactively harvested for Siri suggestions
# Stream name + semantics sourced from iLEAPP's biome*.py artifact modules
# (Apache-2.0, https://github.com/abrignoni/iLEAPP). Envelope format (SEGB
# v2) from CCL Forensics' ccl_segb project (MIT,
# https://github.com/cclgroupltd/ccl-segb), ported to Rust in
# src/parsers/biome/segb.rs — see docs/design/biome-rule-pack-research.md
# for the full sourcing and scope rationale.

[rule]
name = "biome_proactiveharvesting_messages"
description = "Biome stream present: ProactiveHarvesting.Messages (message content proactively harvested for Siri suggestions)"
version = "1"

[rule.match]
sourcetype = "biome"
stream = "ProactiveHarvesting.Messages"

[rule.tag]
value = "harvested_communication"
