# EVTX System log, Microsoft-Windows-Kernel-General 13, "The operating
# system is shutting down at system time {StopTime}." The kernel's own
# orderly-shutdown marker; carries the same tag as EventLog 1074
# (evtx_1074_system_shutdown.toml). A boot (12) with no 13 before it is
# one of the ways an unclean shutdown shows (compare
# evtx_6008_unexpected_shutdown.toml and
# evtx_41_kernel_power_unexpected_reboot.toml).
#
# Checked against real records. Rests on the provider's manifest message
# text and field names (the OS message resources, as listed in nasbench's
# EVTX-ETW-Resources,
# ETWProvidersCSVs/Internal/Microsoft-Windows-Kernel-General.csv) and on
# EricZimmerman's EvtxECmd map for this event (MIT).

[rule]
name = "evtx_kernel_general_os_shutdown"
description = "The operating system is shutting down (Kernel-General 13) - StopTime in the record"
version = "1"

[rule.match]
sourcetype = "evtx"
provider = "Microsoft-Windows-Kernel-General"
event_id = 13

[rule.tag]
value = "system_shutdown"
