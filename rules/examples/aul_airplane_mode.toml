# AUL pattern-of-life: airplane mode toggled on/off.
# Predicates from "Apple Unified Log Predicates in iLEAPP: The Reference"
# (Alexis Brignoni): leapps.org/blog-post?post=2026-08-01-unified-log-predicate-reference
# — "logarchive airplane mode".

[rule]
name = "aul_airplane_mode"
description = "Airplane mode enabled or disabled"

[rule.match]
sourcetype = "aul"
message_contains = [
    "Airplane Mode is now 1",
    "Airplane Mode is now On",
    "Setting airplane mode to true",
    "Airplane mode now active",
    "enabling airplanemode",
    "Airplane mode changed",
    "Airplane Mode is now 0",
    "Airplane Mode is now Off",
    "Setting airplane mode to false",
    "Airplane mode now inactive",
    "Airplane mode Disabled",
    "Toggle AirPlane Mode state",
    "Setting airplane mode enabled",
]

[rule.tag]
value = "airplane_mode"
