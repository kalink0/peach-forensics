# AUL pattern-of-life: flashlight/torch use — both the unspaced and spaced
# AVFlashlight log forms are kept, since which one a given iOS release
# emits varies. Predicates from "Apple Unified Log Predicates in iLEAPP:
# The Reference" (Alexis Brignoni):
# leapps.org/blog-post?post=2026-08-01-unified-log-predicate-reference
# — "logarchive flashlight".

[rule]
name = "aul_flashlight"
description = "Flashlight/torch turned on or off"

[rule.match]
sourcetype = "aul"
message_contains = [
    "[Flashlight Controller]",
    "<<<<AVFlashlight>>>>-",
    "<<<< AVFlashlight >>>>",
]

[rule.tag]
value = "flashlight"
