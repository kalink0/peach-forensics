# EVTX Security-Auditing: the computer attempted to validate credentials for
# an account (NTLM). Fires for both success and failure — the Message column
# (via the built-in template) shows the status code. Companion tag to the
# built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4776(S, F) The
# computer attempted to validate the credentials for an account":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4776

[rule]
name = "evtx_credential_validation"
description = "NTLM credential validation attempt, success or failure (Security-Auditing 4776)"

[rule.match]
sourcetype = "evtx"
event_id = 4776

[rule.tag]
value = "credential_validation"
