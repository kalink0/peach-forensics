# EVTX Security-Auditing: logon attempted using explicit credentials (RunAs,
# scheduled tasks, or any process that supplies different credentials than
# its own logon session) — forensically interesting as a credential-switch
# indicator. Companion tag to the built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4648(S) A logon
# was attempted using explicit credentials":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4648

[rule]
name = "evtx_explicit_credentials"
description = "Logon attempted using explicit credentials, e.g. RunAs (Security-Auditing 4648)"

[rule.match]
sourcetype = "evtx"
event_id = 4648

[rule.tag]
value = "explicit_credentials"
