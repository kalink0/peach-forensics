# AUL pattern-of-life: sensor-level entries from the Face ID and Touch ID
# stacks (camera frames with face-detected/attention/glasses flags,
# face-to-device distance, SpringBoard face-in-view notices, and home-button
# finger-on/finger-off events). Records what the hardware saw, not an unlock
# decision — pair with aul_screen_lock_state/aul_unlock_sessions.
# Predicates from "Apple Unified Log Predicates in iLEAPP: The Reference"
# (Alexis Brignoni): leapps.org/blog-post?post=2026-08-01-unified-log-predicate-reference
# — "logarchive biometric sensor events".
#
# "setFingerOnState: FingerON" added from Thesis Friday #16 (Tim Korver),
# documenting the macOS Touch ID sensor stack specifically — a genuinely
# different subsystem/predicate from the iOS home-button predicates above:
# https://thesisfriday.com/thesis-friday-16-unlocking-a-macbook-with-the-touch-id-sensor/
#
# "TouchID button pressed: 1" added from Thesis Friday #26 (Tim Korver),
# the macOS AppleMesaSEPDriver's own hardware press event — the Mac Touch ID
# sensor's equivalent of the iOS "Home Button Was Pressed" line above
# (tested macOS 26.6.2, build 25G83):
# https://thesisfriday.com/thesis-friday-26-same-unlock-three-different-stories/

[rule]
name = "aul_biometric_sensor_events"
description = "Face ID / Touch ID sensor-level events (not the unlock decision itself)"

[rule.match]
sourcetype = "aul"
message_contains = [
    "PearlCamFrameReceived",
    "getFaceDetectInfo",
    "[User Presence Monitor]",
    "kAppleBiometricFinger",
    "Home Button Was Pressed",
    "setFingerOnState: FingerON",
    "TouchID button pressed: 1",
]

[rule.tag]
value = "biometric_sensor_events"
