# EVTX Security-Auditing: failed account logon. Companion tag to the
# built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4625(F) An
# account failed to log on":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4625

[rule]
name = "evtx_auth_failure"
description = "Failed account logon (Security-Auditing 4625)"

[rule.match]
sourcetype = "evtx"
event_id = 4625

[rule.tag]
value = "auth_failure"
