# EVTX Security-Auditing: member added to a security-enabled local group.
# Shares the `group_membership_change` tag with 4728 (global group) and 4756
# (universal group) — see that file's comment for why. Companion tag to the
# built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4732(S) A member
# was added to a security-enabled local group":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4732

[rule]
name = "evtx_group_membership_change_local"
description = "Member added to a security-enabled local group (Security-Auditing 4732)"
version = "1"

[rule.match]
sourcetype = "evtx"
event_id = 4732

[rule.tag]
value = "group_membership_change"
