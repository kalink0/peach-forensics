# EVTX Security-Auditing: special/administrative privileges assigned to a
# new logon — typically fires alongside a 4624 for an administrator-level
# session. Companion tag to the built-in message template for this event ID
# (message_templates/examples/evtx_security_auditing.toml). Reference:
# Microsoft's official Security Auditing event reference, "4672(S) Special
# privileges assigned to new logon":
# https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4672

[rule]
name = "evtx_privileged_logon"
description = "Special privileges assigned to a new logon (Security-Auditing 4672)"
version = "1"

[rule.match]
sourcetype = "evtx"
event_id = 4672

[rule.tag]
value = "privileged_logon"
