# EVTX: outbound Remote Desktop. Manifest text: "RDP ClientActiveX is
# trying to connect to the server ({Value})", the destination being the
# address the client was asked to connect to. It is a connection attempt
# made by the machine the log came from - a source-side lateral-movement
# artifact - and does not show that the connection succeeded.
#
# The provider name (Microsoft-Windows-TerminalServices-ClientActiveXCore)
# differs from the channel it logs to
# (Microsoft-Windows-TerminalServices-RDPClient/Operational); the rule
# matches the provider, which is what the records carry.
#
# Not validated on local data (no RDPClient log was available). Rests on
# the provider's manifest message text and field names (the OS message
# resources, as listed in nasbench's EVTX-ETW-Resources,
# ETWProvidersCSVs/Internal/Microsoft-Windows-TerminalServices-ClientActiveXCore.csv)
# and on EricZimmerman's EvtxECmd map for this event (MIT).

[rule]
name = "evtx_rdp_client_connect"
description = "This machine's RDP client is trying to connect to a server (ClientActiveXCore 1024, RDPClient/Operational) - outbound RDP, destination in Value"
version = "1"

[rule.match]
sourcetype = "evtx"
provider = "Microsoft-Windows-TerminalServices-ClientActiveXCore"
event_id = 1024

[rule.tag]
value = "rdp_client_connect"
