# AUL pattern-of-life: a USB connection to a computer, as distinct from a
# power source — the kernel's "AppleUSBCableType" (USBHost for a cable to a
# computer, absent with a power source), UserEventAgent's "launching
# clients due to connectType" (1 a power source, 2 a computer; 5 seen once
# and not described), and lockdownd's "usb_host_connected" and
# "bump_connection_count" (the host session, not the cable). Pair with
# aul_usb_power_connections.toml for cable attach/detach.
#
# A forensic acquisition is a computer connection too: these lines are
# exactly what an examiner's tooling produces. Keep an acquisition logbook
# to tell them from user activity.
#
# Per iLEAPP, the lockdownd lines appeared on its iOS 12.4 and 17.2.1
# images only and none of the four on its iOS 26.5.2 image; whether that is
# a property of the iOS version or of retention is not established.
#
# Source: iLEAPP `logarchive_usb_host` (commit 055b35a, 2026-10-03), from
# Tim Korver's "Apple Unified Log search term and process cheatsheet",
# which is not published on thesisfriday.com — iLEAPP is the citable
# source: https://github.com/abrignoni/iLEAPP

[rule]
name = "aul_usb_host"
description = "USB connection to a computer (cable type, connect type, lockdownd host session) — an acquisition produces these too"
version = "1"

[rule.match]
sourcetype = "aul"
message_contains = [
    "AppleUSBCableType",
    "launching clients due to connectType",
    "usb_host_connected",
    "bump_connection_count",
]

[rule.tag]
value = "usb_host_connection"
