# EVTX: Remote Desktop RdpCoreTS 131. Manifest text: "The server accepted
# a new {ConnType} connection from client {ClientIP}." The lowest-level
# record of a remote client reaching the RDP server, ahead of
# authentication and logon (compare RemoteConnectionManager 1149,
# evtx_1149_rdp_connection_established.toml). ConnType and ClientIP are in
# EventData.
#
# The EvtxECmd map for event 98 of the same provider carries unrelated
# PowerShell fields (Path, ScriptBlockText) and was not used as a source.
#
# Not validated on local data (no RdpCoreTS log was available). Rests on
# the provider's manifest message text and field names (the OS message
# resources, as listed in nasbench's EVTX-ETW-Resources,
# ETWProvidersCSVs/Internal/Microsoft-Windows-RemoteDesktopServices-RdpCoreTS.csv)
# and on EricZimmerman's EvtxECmd map for this event (MIT).

[rule]
name = "evtx_rdp_connection_accepted"
description = "The RDP server accepted a new connection from a client (RdpCoreTS 131) - connection type and client IP"
version = "1"

[rule.match]
sourcetype = "evtx"
provider = "Microsoft-Windows-RemoteDesktopServices-RdpCoreTS"
event_id = 131

[rule.tag]
value = "rdp_connection_accepted"
